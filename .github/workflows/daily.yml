name: daily-sync
on:
  schedule:
    - cron: "0 7 * * *"      # 15:00 MYT, ~2.5h after the 12:30 MPOB release window
  workflow_dispatch:
  push:
    paths: ["**.py", "schema.sql", "tests/**"]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MPOB_CONTACT: ${{ secrets.MPOB_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Ingest
        if: github.event_name != 'push'
        run: |
          python price_daily.py --sync
          python ticker.py
          python dosm_ingest.py
      - name: Reconcile (non-zero exit = needs attention)
        if: github.event_name != 'push'
        run: python reconcile.py --run
        continue-on-error: true
      - name: Commit lake
        if: github.event_name != 'push'
        run: |
          git config user.name "mpob-bot"; git config user.email "mpob-bot@users.noreply.github.com"
          git add data/lake
          git diff --cached --quiet || (git commit -m "data: daily sync $(date -u +%F)" && git push)
